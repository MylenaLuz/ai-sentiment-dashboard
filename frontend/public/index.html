<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Dashboard de Análise de Sentimento em Tempo Real"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json fornece metadados usados quando seu aplicativo é instalado
      em um dispositivo móvel ou desktop. Veja https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Observe o uso de %PUBLIC_URL% nas tags acima.
      Ele será substituído pela URL da pasta `public` durante o build.
      Apenas arquivos dentro da pasta `public` podem ser referenciados no HTML.

      Ao contrário de "/favicon.ico" ou "favicon.ico", "%PUBLIC_URL%/favicon.ico"
      funcionará corretamente com roteamento no lado do cliente e URLs públicos não raiz.
      Aprenda a configurar um URL público não raiz executando `npm run build`.
    -->
    <title>Dashboard de Análise de Sentimento</title>
  </head>
  <body>
    <noscript>
      Você precisa habilitar o JavaScript para executar este aplicativo.
    </noscript>
    <div id="root"></div>
    <!--
      Este arquivo HTML é um template.
      Se você abri-lo diretamente no navegador, verá uma página vazia.

      Você pode adicionar fontes, meta tags ou scripts de analytics aqui.
      O passo de build colocará os scripts empacotados dentro da tag <body>.

      Para começar o desenvolvimento, execute `npm start` ou `yarn start`.
      Para criar um pacote de produção, use `npm run build` ou `yarn build`.
    -->
  </body>
</html>
